# Sunucuda: docker compose -f deploy/compose.yaml up -d --build   (bağlam repo kökü)
services:
  kickoff:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: kickoff:latest
    restart: unless-stopped
    env_file:
      - ../server/.env.production
      - ../.env                 # Deployment secrets and overrides take precedence.
    ports: ["8080:8080"]   # rootless Docker: 127.0.0.1 bağlaması yönlendirmiyor; dış erişimi güvenlik duvarıyla kapat
    volumes:
      - ../data/index/index.enc:/app/data/index/index.enc:ro
      - kickoff-data:/app/data/state   # hesap veritabanı (kickoff.sqlite): Elo, hesaplar, en iyi skorlar. Yedeklenmesi gereken tek şey bu.
volumes:
  kickoff-data:
