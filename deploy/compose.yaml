# Sunucuda: docker compose -f deploy/compose.yaml up -d --build   (bağlam repo kökü)
services:
  kickoff:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: kickoff:latest
    restart: unless-stopped
    env_file: ../.env            # KICKOFF_INDEX_KEY, KICKOFF_DAILY_SALT
    ports: ["8080:8080"]   # rootless Docker: 127.0.0.1 bağlaması yönlendirmiyor; dış erişimi güvenlik duvarıyla kapat
    volumes:
      - ../data/index/index.enc:/app/data/index/index.enc:ro
      - kickoff-state:/app/.local   # Godot user:// (accounts.json)
    networks:
      default:
        ipv4_address: 172.18.0.2   # dış proxy köprüsü bu adrese bağlı; yeniden build'de değişmesin
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
volumes:
  kickoff-state:
